name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.18 is the supported minimum (README, engines); 26 is the development version (.nvmrc).
        node: ["22.18", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the import-boundary check resolves workspace packages through their dist output.
      - run: pnpm build
      - name: Lint (ESLint, Prettier, import boundaries)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
